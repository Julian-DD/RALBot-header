[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ralbot"
version = "1.2.0"
description = "Generate a C/SystemVerilog header from a SystemRDL register definition"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Stratum Labs"}
]
keywords = ["systemrdl", "peakrdl", "header", "generator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)"
]
dependencies = [
    "peakrdl"
]

[project.urls]
Homepage = "https://github.com/Julian-DD/SystemRDL-C-header"
Repository = "https://github.com/Julian-DD/SystemRDL-C-header"

[project.entry-points."peakrdl.exporters"]
ralbot = "ralbot.__peakrdl__:Exporter"

[tool.setuptools.packages.find]
include = ["ralbot*"]
